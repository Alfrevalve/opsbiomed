name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Laravel quality checks
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost
      DB_CONNECTION: sqlite
      DB_DATABASE: database/testing.sqlite
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      INITIAL_ADMIN_PASSWORD: test-admin-password
      PILOT_DEMO_PASSWORD: test-pilot-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, intl, mbstring, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Prepare test environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/testing.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Compile Blade views
        run: php artisan view:cache

      - name: Validate routes
        run: php artisan route:list --except-vendor

      - name: Run PHPUnit
        run: php artisan test --compact
