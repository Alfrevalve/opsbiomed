name: cPanel release readiness (deployment disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Reuse CI checks
    uses: ./.github/workflows/ci.yml

  remote-deployment:
    name: Remote deployment intentionally disabled
    if: false
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Require approved staging rehearsal
        run: |
          echo "Remote deployment is disabled until staging backup, restore, rollback, and scheduler checks are evidenced."
          exit 1
